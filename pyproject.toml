[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "m6media"
version = "1.3.1"
description = "Fix Haval M6 (2023) USB playback: convert AVI/XviD, AC3 and incompatible MKV to H.264/AAC MP4; prepare music and photos"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "haval", "haval-m6", "haval m6", "m6-plus", "haval m6 2023",
    "car-media", "car-media-player", "usb", "flash-drive",
    "video-converter", "ffmpeg", "xvid", "divx", "avi", "mkv", "mp4",
    "h264", "aac", "ac3", "fat32", "exfat",
]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = []

[project.scripts]
m6media = "m6media:main"

[tool.setuptools]
py-modules = ["m6media"]
